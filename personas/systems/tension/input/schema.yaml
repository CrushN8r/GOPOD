type: object
required:
  - event_id
  - timestamp
  - actors
  - expected_roles
  - statements
  - known_state
  - conditions
properties:
  event_id:
    type: string
  timestamp:
    type: string
  actors:
    type: array
    items:
      type: object
      required:
        - actor_id
        - role
      properties:
        actor_id:
          type: string
        role:
          type: string
          enum:
            - doc
            - pip
            - students
            - guards
  expected_roles:
    type: array
    items:
      type: object
      required:
        - actor_id
        - expected_role
      properties:
        actor_id:
          type: string
        expected_role:
          type: string
          enum:
            - doc
            - pip
            - students
            - guards
  statements:
    type: array
    items:
      type: object
      required:
        - actor_id
        - topic
        - value
      properties:
        actor_id:
          type: string
        topic:
          type: string
        value:
          type: string
        state_key:
          type: string
  known_state:
    type: array
    items:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
  conditions:
    type: array
    items:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            - stable
            - unstable
            - changing
            - fixed
