<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOPOD Weather Kit</title>
<!-- 2026-10-14 (operator: "build best weather kit to review first, then
     implement"): a review page only - the weather card bubble for each
     weather, in the chat's own bubble style, before it goes into the chat.
     Assets: weather/ (README.md there). Nothing here is wired to Wire-Pod. -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gopod_chat_bubbles.css">
<link rel="stylesheet" href="css/gopod_weather_kit.css">
</head>
<body>
<h1>GOPOD Weather Kit</h1>
<p class="kit-note">For review. Click a card to hear its sound. Vector's own weather faces, digits and sounds (weather/README.md).</p>
<div class="kit-bar">
  Eye colour:
  <button type="button" data-eye="brobot_1">Brobot 1</button>
  <button type="button" data-eye="brobot_2">Brobot 2</button>
  <button type="button" data-eye="vector">Vector cyan</button>
  &nbsp; Units:
  <button type="button" data-units="C">°C</button>
  <button type="button" data-units="F">°F</button>
</div>
<div class="kit-list" id="kitList"></div>
<script src="js/gopod_weather_kit.js"></script>
</body>
</html>
